kind = "web"
previewPath = "/"
title = "Humain Numérique"
version = "1.0.0"
id = "artifacts/digital-human"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 26234

[services.development]
run = "pnpm --filter @workspace/digital-human run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/digital-human", "run", "build" ]
serve = "static"
publicDir = "artifacts/digital-human/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "26234"
BASE_PATH = "/"
